name: build

# Gera o agente para Windows (.exe) E Linux (binário) — PyInstaller é por-plataforma,
# então usamos uma matriz de runners. Em push/manual: artefatos baixáveis (Actions → run → Artifacts).
# Em tag v* : cria um Release com os binários + o pacote-fonte (.zip) anexados.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para criar Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: prosight-connector.exe
            out: dist/prosight-connector.exe
          - os: ubuntu-latest
            asset: prosight-connector-linux
            out: dist/prosight-connector
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install pyinstaller cryptography
      - name: Testes (camada TOTVS)
        run: python test_totvs.py
      - name: Build (PyInstaller)
        run: pyinstaller prosight-connector.spec
      - name: Renomear binário (asset por plataforma)
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.out }}" "out/${{ matrix.asset }}"
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar fonte (Python — Windows/Linux)
        run: |
          mkdir -p out
          zip -j out/prosight-connector-src.zip \
            prosight_connector.py totvs.py requirements.txt config.example.json \
            INSTALL-ONPREM.md INSTALL-LINUX.md ONBOARDING.md README.md
      - uses: actions/upload-artifact@v4
        with:
          name: prosight-connector-src.zip
          path: out/prosight-connector-src.zip

  release:
    needs: [ build, source-zip ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar Release com os anexos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/prosight-connector.exe/prosight-connector.exe
            artifacts/prosight-connector-linux/prosight-connector-linux
            artifacts/prosight-connector-src.zip/prosight-connector-src.zip
          generate_release_notes: true
