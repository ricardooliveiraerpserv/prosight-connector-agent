name: build

# Gera o agente para Windows (.exe) E Linux (binário) — PyInstaller é por-plataforma,
# então usamos uma matriz de runners. Em push/manual: apenas builda+testa (CI).
# Em tag v* : anexa cada binário + o pacote-fonte (.zip) DIRETO no Release (storage do Release,
# fora da cota de artifacts do Actions).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para criar/atualizar o Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: prosight-connector.exe
            out: dist/prosight-connector.exe
          - os: ubuntu-latest
            asset: prosight-connector-linux
            out: dist/prosight-connector
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install pyinstaller cryptography
      - name: Testes (camada TOTVS)
        run: python test_totvs.py
      - name: Build (PyInstaller)
        run: pyinstaller prosight-connector.spec
      - name: Renomear binário (asset por plataforma)
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.out }}" "out/${{ matrix.asset }}"
      - name: Anexar binário ao Release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}

  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar fonte (Python — Windows/Linux)
        run: |
          mkdir -p out
          zip -j out/prosight-connector-src.zip \
            prosight_connector.py totvs.py requirements.txt config.example.json \
            INSTALL-ONPREM.md INSTALL-LINUX.md ONBOARDING.md README.md
      - name: Anexar fonte ao Release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/prosight-connector-src.zip
          generate_release_notes: true
